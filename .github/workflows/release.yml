name: Release

# Releases are cut by hand: nothing here runs on a merge, only on a pushed tag.
#
#   v1.4.0-rc1  ->  GitHub pre-release (the candidate put up for the Apache vote)
#   v1.4.0      ->  GitHub release + push the Docker image
#
# Either way the release carries an Apache-style source tarball and the Linux
# webhook binary. The release manager downloads the tarball and signs /
# checksums it locally before starting the vote; nothing is signed here.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Base name of the source release artifact, per Apache naming conventions.
  ARTIFACT_BASENAME: apache-casbin-admission-webhook

jobs:
  release:
    name: Release ${{ github.ref_name }}
    if: github.repository == 'apache/casbin-admission-webhook'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.base_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # v1.4.0-rc1 -> 1.4.0. The tarball the PPMC votes on is the exact tarball
          # that ships, so the candidate counter is never part of its name.
          BASE_VERSION="${VERSION%%-rc*}"
          if [ "$VERSION" = "$BASE_VERSION" ]; then
            PRERELEASE=false
          else
            PRERELEASE=true
          fi
          # Anything that is neither vX.Y.Z nor vX.Y.Z-rcN is a typo, and a typo
          # must not reach Docker Hub.
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-rcN."
            exit 1
          fi
          {
            echo "base_version=$BASE_VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Tag $GITHUB_REF_NAME -> version $BASE_VERSION (pre-release: $PRERELEASE)"

      - name: Build source release tarball
        id: package
        run: |
          set -euo pipefail
          NAME="${ARTIFACT_BASENAME}-${{ steps.version.outputs.base_version }}-incubating-src"
          ASSET="${RUNNER_TEMP}/${NAME}.tar.gz"
          # git archive gives us exactly the tracked sources at this tag, unpacking
          # into a single top-level directory named after the release.
          git archive --format=tar.gz --prefix="$NAME/" -o "$ASSET" HEAD
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          ls -l "$ASSET"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build binary
        run: make build

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: |
          set -euo pipefail
          FLAGS=(--title "$TAG" --generate-notes)
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" "$ASSET" "webhook#Webhook Binary (Linux AMD64)" "${FLAGS[@]}"

  docker:
    name: Build and Push Docker Image
    needs: release
    # Release candidates exist only for the vote; they never reach a registry.
    if: needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Check the Docker Hub credentials are configured
        id: gate
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_TOKEN is not set, so no Docker image was pushed for ${VERSION}."
          fi

      - name: Checkout Repository
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.gate.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: steps.gate.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.gate.outputs.enabled == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            casbin/casbin-admission-webhook:latest
            casbin/casbin-admission-webhook:${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
